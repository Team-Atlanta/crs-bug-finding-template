name: crs-bug-finding-template
type:
- bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/crs-bug-finding-template

# No prepare_phase: the runner builds FROM the framework-provided
# base_runner_image at run time and installs its own tooling.

target_build_phase:
- name: build
  dockerfile: oss-crs/dockerfiles/builder.Dockerfile
  outputs:
  - build
  - src
- name: coverage-build
  dockerfile: oss-crs/dockerfiles/coverage-builder.Dockerfile
  outputs:
  - coverage
- name: afl-build
  dockerfile: oss-crs/dockerfiles/afl-builder.Dockerfile
  outputs:
  - afl
- name: debug-build
  dockerfile: oss-crs/dockerfiles/debug-builder.Dockerfile
  outputs:
  - debug
- name: codeql-build
  dockerfile: oss-crs/dockerfiles/codeql-builder.Dockerfile
  outputs:
  - codeql

crs_run_phase:
  main:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile
    additional_env:
      # Defaults; override in the compose file's additional_env.
      CRS_AGENT: claude_code
      # Which entrypoint the multiplexer (crs/entrypoint/entrypoint.sh) runs. Default run_crs.
      # Options: run_crs | run_crs_langgraph | run_crs_subagents |
      #          test_gdb | test_codeql | test_fuzz | test_afl | test_coverage | idle
      CRS_ENTRYPOINT: run_crs
      # ANTHROPIC_MODEL: claude-opus-4-8
      # AGENT_TIMEOUT: "0"   # seconds, 0 = no limit (default)

supported_target:
  mode:
  - full
  - delta
  language:
  - c
  sanitizer:
  - address
  architecture:
  - x86_64

# Validation baseline when an LLM proxy is configured (llm_config). Ignored
# when the CRS authenticates via CLAUDE_CODE_OAUTH_TOKEN.
required_llms:
- claude-opus-4-8
- claude-sonnet-4-6
- claude-haiku-4-5-20251001
